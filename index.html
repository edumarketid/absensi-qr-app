<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Absensi Murid - v1.35</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; color: #172033; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; border-radius: 1rem; }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

  <div class="w-full max-w-md h-[100vh] sm:h-[840px] bg-white flex flex-col justify-between shadow-2xl overflow-hidden sm:rounded-3xl relative border border-gray-200">

    <!-- HEADER UTAMA -->
    <header class="bg-[#0b3c5d] text-white py-3.5 px-4 z-30 shadow-md flex-shrink-0">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="min-w-0 flex-1">
            <h1 class="font-bold text-base leading-tight">Sistem Absensi Murid</h1>
            <p id="app-header-school-name" class="text-xs text-gray-300 truncate">SMK Negeri 1 Contoh</p>
          </div>
        </div>
        <div class="text-right flex-shrink-0">
          <div class="flex items-center justify-end space-x-1.5">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
            <span id="status-text" class="text-xs font-semibold">Memeriksa...</span>
          </div>
          <span id="app-version-tag" class="text-[10px] font-mono text-emerald-300 bg-emerald-950/60 px-1.5 py-0.2 rounded-md border border-emerald-500/30 block mt-0.5">v1.35</span>
        </div>
      </div>
    </header>

    <!-- VIEW 1: SCANNER KAMERA -->
    <main id="view-scanner" class="flex-1 flex flex-col justify-between relative bg-gray-900 overflow-hidden">
      <div class="flex-1 relative flex flex-col items-center justify-center p-4 bg-black">
        <div class="w-full h-full max-h-[420px] overflow-hidden rounded-2xl relative flex items-center justify-center bg-gray-800 border border-gray-700">
          <div id="reader" class="w-full h-full"></div>
          <div id="camera-off-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 space-y-3 bg-gray-900 z-10">
            <i class="fa-solid fa-camera text-gray-500 text-4xl"></i>
            <p class="text-xs text-gray-400 font-semibold">Kamera Non-Aktif.<br>Klik "Nyalakan Kamera" untuk memindai QR.</p>
          </div>
        </div>

        <div id="scan-frame-box" class="absolute w-64 h-64 pointer-events-none flex items-center justify-center z-20 hidden">
          <div class="absolute -top-1 -left-1 w-8 h-8 border-t-4 border-l-4 border-green-400 rounded-tl-xl"></div>
          <div class="absolute -top-1 -right-1 w-8 h-8 border-t-4 border-r-4 border-green-400 rounded-tr-xl"></div>
          <div class="absolute -bottom-1 -left-1 w-8 h-8 border-b-4 border-l-4 border-green-400 rounded-bl-xl"></div>
          <div class="absolute -bottom-1 -right-1 w-8 h-8 border-b-4 border-r-4 border-green-400 rounded-br-xl"></div>
        </div>

        <div class="absolute bottom-4 left-4 right-4 flex items-center justify-between gap-2 z-20">
          <button onclick="toggleScanSessionMode()" class="bg-black/60 text-white flex-1 py-2.5 rounded-xl text-xs font-medium flex flex-col items-center justify-center gap-1 backdrop-blur-md border border-white/10">
            <i id="session-icon" class="fa-solid fa-sun text-amber-400 text-sm"></i>
            <span id="session-mode-text">Mode Pagi</span>
          </button>
          <button id="btn-toggle-camera" onclick="toggleCameraState()" class="bg-blue-600 text-white flex-[2] py-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-lg">
            <i class="fa-solid fa-video"></i>
            <span id="btn-camera-text">Nyalakan Kamera</span>
          </button>
        </div>
      </div>

      <div class="bg-white p-3 border-t border-gray-100 flex items-center justify-between shadow-sm z-20">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center font-bold">
            <i class="fa-solid fa-bolt text-sm"></i>
          </div>
          <div>
            <h4 class="text-xs font-bold text-gray-800">Queue Offline Sync</h4>
            <p id="sync-info-text" class="text-[10px] text-gray-500">Otomatis sinkron ke Sheet...</p>
          </div>
        </div>
        <div class="text-right pl-2 border-l border-gray-200 cursor-pointer" onclick="triggerManualSync()">
          <span class="text-[10px] text-gray-400 block font-medium">Queue</span>
          <span id="queue-count" class="text-sm font-extrabold text-gray-800">0</span>
        </div>
      </div>
    </main>

    <!-- VIEW 2: HASIL SCAN -->
    <main id="view-success" class="flex-1 flex-col overflow-y-auto no-scrollbar bg-slate-50 p-4 hidden">
      <div id="status-card-box" class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center shadow-sm space-y-2">
        <h3 id="res-nama" class="font-bold text-gray-900 text-lg truncate">-</h3>
        <p class="text-xs text-gray-600">NISN: <span id="res-nisn" class="font-bold">-</span> | Kelas: <span id="res-kelas" class="font-bold">-</span></p>
        <div class="text-emerald-600 font-extrabold text-xl"><i class="fa-solid fa-circle-check"></i> <span id="res-presensi-status">HADIR</span></div>
        <p class="text-xs text-emerald-700"><i class="fa-regular fa-clock"></i> <span id="res-jam-scan">00:00:00</span></p>
      </div>
      <button onclick="toggleView('scanner')" class="w-full mt-4 bg-blue-600 text-white font-semibold py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md">
        <i class="fa-solid fa-qrcode"></i> Scan Siswa Berikutnya
      </button>
    </main>

    <!-- VIEW 3: DATA SISWA -->
    <main id="view-students" class="flex-1 flex-col overflow-y-auto no-scrollbar bg-slate-50 p-4 hidden">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg text-gray-900">Data Master Siswa</h2>
        <button onclick="autoDownloadMasterStudents()" class="bg-blue-50 text-blue-600 p-2 rounded-xl text-xs font-bold border border-blue-200"><i class="fa-solid fa-rotate"></i> Sync</button>
      </div>
      <input type="text" id="search-student-input" onkeyup="filterStudentsList()" placeholder="Cari nama, NISN..." class="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl text-xs mb-3">
      <div id="students-list-container" class="space-y-2 pb-4"></div>
    </main>

    <!-- MODAL MENU POPUP UTAMA -->
    <div id="menu-modal" class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end hidden">
      <div class="bg-white rounded-t-3xl p-5 space-y-4 shadow-2xl">
        <div class="flex items-center justify-between border-b border-gray-100 pb-3">
          <h3 class="font-bold text-gray-900 text-sm">Menu Utama Aplikasi</h3>
          <button onclick="toggleMenuModal()" class="w-7 h-7 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <!-- PEMANGGILAN HALAMAN TERPISAH MANDIRI -->
          <button onclick="toggleMenuModal(); bukaHalamanLaporan();" class="p-3 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col items-center justify-center gap-1.5 hover:bg-emerald-50 transition">
            <i class="fa-solid fa-file-invoice text-xl text-emerald-600"></i>
            <span class="text-xs font-bold text-gray-800">Laporan Rekap</span>
          </button>
          <button onclick="toggleMenuModal(); bukaHalamanCetakQR();" class="p-3 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col items-center justify-center gap-1.5 hover:bg-indigo-50 transition">
            <i class="fa-solid fa-print text-xl text-indigo-600"></i>
            <span class="text-xs font-bold text-gray-800">Cetak QR Code</span>
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bg-white border-t border-gray-200 px-3 py-1.5 flex justify-between items-center text-center z-30 flex-shrink-0">
      <button onclick="toggleView('students')" class="flex-1 text-gray-400 flex flex-col items-center">
        <i class="fa-solid fa-user-group text-sm"></i><span class="text-[10px] font-medium">Siswa</span>
      </button>
      <button onclick="toggleView('scanner')" class="flex-1 text-blue-600 flex flex-col items-center -mt-4">
        <div class="w-12 h-12 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center border-4 border-white"><i class="fa-solid fa-qrcode text-lg"></i></div>
        <span class="text-[10px] font-bold mt-0.5">Scanner</span>
      </button>
      <button onclick="toggleMenuModal()" class="flex-1 text-gray-400 flex flex-col items-center">
        <i class="fa-solid fa-bars text-sm"></i><span class="text-[10px] font-medium">Menu</span>
      </button>
    </nav>

  </div>

  <script>
    // ISI URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVGAsO-sG7E9bHsSxQ-M16EykkO6jc6QpLzDY7sWg9qEHIbpk9Re32IGgDn1qPOmJ_/exec"; 

    let html5QrCode = null, isCameraActive = false, db = null, cachedStudents = [], currentScanSession = "PAGI";

    function bukaHalamanLaporan() { window.open(GAS_WEB_APP_URL + "?page=laporan", "_blank"); }
    function bukaHalamanCetakQR() { window.open(GAS_WEB_APP_URL + "?page=cetak-qr", "_blank"); }

    function initDatabase() {
      return new Promise((resolve) => {
        const req = indexedDB.open("AbsensiQR_DB", 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains("students")) database.createObjectStore("students", { keyPath: "id_siswa" });
          if (!database.objectStoreNames.contains("attendance_queue")) database.createObjectStore("attendance_queue", { keyPath: "queue_id" });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      });
    }

    async function autoDownloadMasterStudents() {
      if (!navigator.onLine) return;
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=GET_APP_DATA`);
        const result = await response.json();
        if (result.students) {
          const tx = db.transaction("students", "readwrite");
          const store = tx.objectStore("students");
          store.clear();
          result.students.forEach(s => store.put({ id_siswa: String(s.qr_key || s.id_siswa).trim(), nisn: String(s.nisn).trim(), nama: String(s.nama).trim(), kelas: String(s.kelas).trim() }));
          tx.oncomplete = () => loadStudentsView();
        }
      } catch (e) {}
    }

    async function loadStudentsView() {
      const tx = db.transaction("students", "readonly");
      tx.objectStore("students").getAll().onsuccess = (e) => {
        cachedStudents = e.target.result || [];
        filterStudentsList();
      };
    }

    function filterStudentsList() {
      const q = document.getElementById('search-student-input').value.toLowerCase();
      const filtered = cachedStudents.filter(s => s.nama.toLowerCase().includes(q) || s.id_siswa.toLowerCase().includes(q));
      const container = document.getElementById('students-list-container');
      container.innerHTML = filtered.map(s => `
        <div class="bg-white p-3 rounded-2xl border border-gray-100 flex items-center justify-between">
          <div><h4 class="font-bold text-xs text-gray-900">${s.nama}</h4><p class="text-[10px] text-gray-500">ID: ${s.id_siswa} | NISN: ${s.nisn}</p></div>
          <span class="px-2 py-1 bg-emerald-50 text-emerald-700 font-bold text-[10px] rounded-lg">${s.kelas}</span>
        </div>
      `).join('');
    }

    function toggleView(v) {
      ['view-scanner', 'view-success', 'view-students'].forEach(i => document.getElementById(i).classList.add('hidden'));
      document.getElementById('view-' + v).classList.remove('hidden');
    }

    function toggleMenuModal() { document.getElementById('menu-modal').classList.toggle('hidden'); }
    function toggleScanSessionMode() {
      currentScanSession = currentScanSession === "PAGI" ? "SIANG" : "PAGI";
      document.getElementById("session-mode-text").innerText = `Mode ${currentScanSession === 'PAGI' ? 'Pagi' : 'Siang'}`;
    }

    async function initScanner() {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      document.getElementById('camera-off-placeholder').classList.add('hidden');
      document.getElementById('scan-frame-box').classList.remove('hidden');
      await html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, onScanSuccess);
      isCameraActive = true;
      document.getElementById('btn-camera-text').innerText = "Matikan Kamera";
    }

    async function stopCamera() {
      if (html5QrCode && isCameraActive) await html5QrCode.stop();
      isCameraActive = false;
      document.getElementById('btn-camera-text').innerText = "Nyalakan Kamera";
      document.getElementById('camera-off-placeholder').classList.remove('hidden');
      document.getElementById('scan-frame-box').classList.add('hidden');
    }

    function toggleCameraState() { isCameraActive ? stopCamera() : initScanner(); }
    async function onScanSuccess(text) {
      await stopCamera();
      const tx = db.transaction("students", "readonly");
      tx.objectStore("students").get(text.trim()).onsuccess = (e) => {
        const student = e.target.result || { nama: "Siswa Tidak Ditemukan", nisn: "-", kelas: "-", id_siswa: text };
        document.getElementById('res-nama').innerText = student.nama;
        document.getElementById('res-nisn').innerText = student.nisn;
        document.getElementById('res-kelas').innerText = student.kelas;
        document.getElementById('res-jam-scan').innerText = new Date().toTimeString().split(' ')[0];
        toggleView('success');
      };
    }

    window.onload = async () => {
      await initDatabase();
      await autoDownloadMasterStudents();
    };
  </script>
</body>
</html>
